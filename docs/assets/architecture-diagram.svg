  <text x="34" y="36" fill="#A69682" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.4">CLIENT-SIDE ARCHITECTURE</text>
  <text x="1166" y="36" text-anchor="end" fill="#7AC49A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">100% IN-BROWSER · ZERO NETWORK CALLS</text>

  <!-- Column 1: Browser APIs -->
  <g transform="translate(34, 56)">
