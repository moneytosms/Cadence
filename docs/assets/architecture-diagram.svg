    <text x="28" y="84" fill="#A69682" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">Test + Pace Tiers</text>

    <rect x="172" y="44" width="146" height="52" rx="10" fill="#18130F" stroke="#F3EAD8" stroke-opacity="0.09" stroke-width="1"/>
    <text x="184" y="66" fill="#F3EAD8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">ScriptStudio</text>
    <text x="184" y="84" fill="#A69682" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">Borderless Editor</text>

    <rect x="16" y="106" width="146" height="52" rx="10" fill="#18130F" stroke="#F3EAD8" stroke-opacity="0.09" stroke-width="1"/>
    <text x="28" y="128" fill="#F3EAD8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">LibraryView</text>
    <text x="28" y="146" fill="#A69682" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">MD/TXT + Backup</text>

    <rect x="172" y="106" width="146" height="52" rx="10" fill="#18130F" stroke="#F3EAD8" stroke-opacity="0.09" stroke-width="1"/>
    <text x="184" y="128" fill="#F3EAD8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">SettingsView</text>
    <text x="184" y="146" fill="#A69682" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">Cues · Keys · Look</text>

    <!-- Highlighted PrompterStage box -->
    <rect x="16" y="168" width="302" height="52" rx="10" fill="#1D3327" stroke="#63AD82" stroke-opacity="0.4" stroke-width="1"/>
    <text x="30" y="190" fill="#F3EAD8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">PrompterStage (Lazy Chunk)</text>
    <text x="30" y="208" fill="#8CD4AA" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">translate3d 60fps · Webcam · Voice Guard</text>
