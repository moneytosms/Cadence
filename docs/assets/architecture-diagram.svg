  <circle cx="52" cy="322" r="3.5" fill="#63AD82"/>
  <text x="64" y="326" fill="#B8A995" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">Privacy guarantee: Camera video, microphone audio, scripts, and custom cues never leave the browser tab.</text>
