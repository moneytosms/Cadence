<svg width="1200" height="352" viewBox="0 0 1200 352" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cadence client-side architecture diagram">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1200" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B1510"/>
      <stop offset="100%" stop-color="#130F0C"/>
    </linearGradient>
    <linearGradient id="colBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#261E17"/>
      <stop offset="100%" stop-color="#1D1611"/>
    </linearGradient>
    <linearGradient id="colBoxPine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3327"/>
      <stop offset="100%" stop-color="#17271E"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="350" rx="18" fill="url(#archBg)" stroke="#F3EAD8" stroke-opacity="0.12" stroke-width="1.5"/>

