    <text x="18" y="28" fill="#D99B52" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1">BROWSER APIS</text>

    <rect x="16" y="44" width="288" height="52" rx="10" fill="#18130F" stroke="#F3EAD8" stroke-opacity="0.09" stroke-width="1"/>
    <text x="30" y="66" fill="#F3EAD8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">Web Audio API</text>
    <text x="30" y="84" fill="#A69682" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">AnalyserNode RMS dB + chime synth</text>

    <rect x="16" y="106" width="288" height="52" rx="10" fill="#18130F" stroke="#F3EAD8" stroke-opacity="0.09" stroke-width="1"/>
    <text x="30" y="128" fill="#F3EAD8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">MediaDevices &amp; Fullscreen</text>
    <text x="30" y="146" fill="#A69682" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">Local webcam feed + mic capture</text>

    <rect x="16" y="168" width="288" height="52" rx="10" fill="#18130F" stroke="#F3EAD8" stroke-opacity="0.09" stroke-width="1"/>
    <text x="30" y="190" fill="#F3EAD8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">localStorage Persistence</text>
    <text x="30" y="208" fill="#A69682" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">Scripts, cues, history, JSON export</text>
  </g>

  <!-- Connectors Col 1 -> Col 2 -->
  <g stroke="#63AD82" stroke-opacity="0.45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="358" y1="126" x2="404" y2="126"/>
    <path d="M398 120L404 126L398 132"/>

    <line x1="358" y1="188" x2="404" y2="188"/>
    <path d="M398 182L404 188L398 194"/>

    <line x1="358" y1="250" x2="404" y2="250"/>
    <path d="M398 244L404 250L398 256"/>
