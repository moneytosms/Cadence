    <text x="18" y="28" fill="#D99B52" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1">STUDIO WORKSPACE (REACT 19)</text>

    <rect x="16" y="44" width="146" height="52" rx="10" fill="#18130F" stroke="#F3EAD8" stroke-opacity="0.09" stroke-width="1"/>
