    <text x="30" y="84" fill="#A9C7B5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">MicVadController gate, hold timers, cue chimes</text>

    <rect x="16" y="106" width="334" height="52" rx="10" fill="#13221A" stroke="#63AD82" stroke-opacity="0.22" stroke-width="1"/>
    <text x="30" y="128" fill="#F3EAD8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">scriptParser.ts</text>
    <text x="30" y="146" fill="#A9C7B5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Tokenizer, custom cues, WPM &amp; duration solver</text>

    <rect x="16" y="168" width="334" height="52" rx="10" fill="#13221A" stroke="#63AD82" stroke-opacity="0.22" stroke-width="1"/>
    <text x="30" y="190" fill="#F3EAD8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">useLocalStorage.ts + App.tsx</text>
    <text x="30" y="208" fill="#A9C7B5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Deep-merged state, theme sync, lazy code split</text>
  </g>

  <!-- Connectors Col 2 -> Col 3 -->
  <g stroke="#D99B52" stroke-opacity="0.5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="780" y1="126" x2="826" y2="126"/>
    <path d="M820 120L826 126L820 132"/>

    <line x1="780" y1="188" x2="826" y2="188"/>
    <path d="M820 182L826 188L820 194"/>

    <line x1="780" y1="250" x2="826" y2="250"/>
    <path d="M820 244L826 250L820 256"/>
