<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadence - Natural Pace Teleprompter Studio</title>
    <meta
      name="description"
      content="Measure your natural speaking pace, edit scripts with programmable pauses and custom cues, and prompt smoothly on camera. 100% client-side in your browser."
    />
    <meta name="theme-color" content="#15110E" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#EFE5D3" media="(prefers-color-scheme: light)" />

    <!-- Favicons & Web App Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- OpenGraph Social Card -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cadence" />
    <meta property="og:title" content="Cadence - Natural Pace Teleprompter Studio" />
    <meta
      property="og:description"
      content="Measure your natural speaking pace, edit scripts with programmable pauses and custom cues, and prompt smoothly on camera. 100% client-side."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cadence - Natural Pace Teleprompter Studio" />
    <meta
      name="twitter:description"
      content="Measure your natural speaking pace, edit scripts with programmable pauses and custom cues, and prompt smoothly on camera."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Cadence",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "All",
        "description": "Client-side browser teleprompter studio with reading speed calibration, microphone pause detection, programmable custom cues, and webcam eye-line framing.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Prevent theme flash before React hydrates -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('cadence_studio_settings_v1');
          var theme = raw ? JSON.parse(raw).uiTheme : 'dark';
          document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&family=Merriweather:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased selection:bg-[#3E7C59]/35">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
